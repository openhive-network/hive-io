include:
  - project: 'hive/common-ci-configuration'
    ref: develop
    file:
      - '/templates/base.gitlab-ci.yml'
      - '/templates/npm_projects.gitlab-ci.yml'

variables:
  # npm-common-config is ccc, tracked from its develop branch: its pnpm
  # catalogs pin React/Next, Tailwind, TypeScript and the @hiveio libraries
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_UPDATE_FLAGS: --remote
  CCC_SUBMODULE_DIR: 'npm-common-config'

stages:
  - build
  - deploy_staging
  - deploy_master

cache:
  untracked: true
  key: '$CI_PROJECT_ID'
  paths:
    - .pnpm-store/
    - apps/web/node_modules/
    - apps/web/.next/
    - packages/hive-lib/node_modules/
    - packages/hive-lib/dist/
    - packages/auth-components/node_modules/
    - packages/auth-components/dist/

build:
  stage: build
  image: ${NODE_TEST_TOOLS_IMAGE}
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.6.0 --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - ls -l
    - git submodule status --recursive
    - !reference [.pnpm_install_with_catalog_fallback, script]
    - if [ -n "$CI_COMMIT_BRANCH" ] && [ "$CI_COMMIT_BRANCH" != "master" ]; then export SITE_NOINDEX=1; unset NEXT_PUBLIC_GA_ID NEXT_PUBLIC_GTM_ID; fi
    - pnpm build
    - echo "BUILD SUCCESSFULLY"
  artifacts:
    paths:
      - apps/web/out/
      - pnpm-lock.catalog-refreshed.yaml
    expire_in: 20 mins
  # environment:
  #   name: development
  # only:
  #   - develop

pnpm_catalog_check:
  extends: .pnpm_catalog_check
  stage: build

deploy_staging:
  stage: deploy_staging
  image: python:3.5
  interruptible: false
  dependencies:
    - build
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export S3_BUCKET_NAME=$S3_BUCKET_NAME_STAGING
    - export DISTRIBUTION_ID=$DISTRIBUTION_ID
    - pip install awscli --upgrade --user
    - export PATH=~/.local/bin:$PATH
    - aws s3 sync --acl public-read --delete apps/web/out $S3_BUCKET_NAME_STAGING
    - aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths '/*'
    - echo "DEPLOYED SUCCESSFULLY TO STAGING"
  environment:
    name: development
  only:
    - develop

deploy_master:
  stage: deploy_master
  image: python:3.5
  interruptible: false
  dependencies:
    - build
  script:
    - export AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
    - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
    - export S3_BUCKET_NAME=$S3_BUCKET_NAME_PRODUCTION
    - export DISTRIBUTION_ID=$DISTRIBUTION_ID
    - pip install awscli --upgrade --user
    - export PATH=~/.local/bin:$PATH
    - aws s3 sync --acl public-read --cache-control "max-age=2592000, public" --delete apps/web/out $S3_BUCKET_NAME_PRODUCTION
    - aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths '/*'
    - echo "DEPLOYED SUCCESSFULLY TO PRODUCTION"
  environment:
    name: production
  only:
    - master
